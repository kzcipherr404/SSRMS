{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_heading %}Edit Student{% endblock %}
{% block content %}
<div class="page-intro">
    <div>
        <h2>Update student information</h2>
        <p>Make changes to the selected student record.</p>
    </div>
    <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">← Back to records</a>
</div>
<div class="card form-card">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="student_number">Student Number</label>
                <input class="form-control" type="text" id="student_number" name="student_number" value="{{ student[1] }}" required>
            </div>
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input class="form-control" type="text" id="first_name" name="first_name" value="{{ student[2] }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input class="form-control" type="text" id="last_name" name="last_name" value="{{ student[3] }}" required>
            </div>
            <div class="form-group">
                <label for="programme">Programme</label>
                <input class="form-control" type="text" id="programme" name="programme" value="{{ student[4] }}" required>
            </div>
            <div class="form-group">
                <label for="year_of_study">Year of Study</label>
                <select class="form-control" id="year_of_study" name="year_of_study" required>
                    {% for year in range(1, 9) %}
                    <option value="{{ year }}" {% if student[5] == year %}selected{% endif %}>Year {{ year }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn" type="submit">Save Changes</button>
            <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
