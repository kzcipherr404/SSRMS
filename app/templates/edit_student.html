<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student Record - SSRMS</title>
</head>
<body>

    <h1>Edit Student Record</h1>

    <form method="POST">

        <label>Student Number:</label>
        <input
            type="text"
            name="student_number"
            value="{{ student[1] }}"
            required
        >
        <br><br>

        <label>First Name:</label>
        <input
            type="text"
            name="first_name"
            value="{{ student[2] }}"
            required
        >
        <br><br>

        <label>Last Name:</label>
        <input
            type="text"
            name="last_name"
            value="{{ student[3] }}"
            required
        >
        <br><br>

        <label>Programme:</label>
        <input
            type="text"
            name="programme"
            value="{{ student[4] }}"
            required
        >
        <br><br>

        <label>Year of Study:</label>
        <input
            type="number"
            name="year_of_study"
            min="1"
            max="8"
            value="{{ student[5] }}"
            required
        >
        <br><br>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="{{ url_for('students.list_students') }}">
        Back to Student Records
    </a>

</body>
</html>
