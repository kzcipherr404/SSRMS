<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - SSRMS</title>
</head>
<body>

    <h1>Add Student Record</h1>

    <p>
        Logged in as: {{ session.username }}
        ({{ session.role }})
    </p>

    <a href="{{ url_for('students.list_students') }}">View Student Records</a>
    |
    <a href="{{ url_for('auth.dashboard') }}">Dashboard</a>
    |
    <a href="{{ url_for('auth.logout') }}">Logout</a>

    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('students.add_student') }}">

        <div>
            <label for="user_id">Existing User ID:</label>
            <input
                type="number"
                id="user_id"
                name="user_id"
                required
                min="1"
            >
        </div>

        <br>

        <div>
            <label for="student_number">Student Number:</label>
            <input
                type="text"
                id="student_number"
                name="student_number"
                required
            >
        </div>

        <br>

        <div>
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                required
            >
        </div>

        <br>

        <div>
            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                required
            >
        </div>

        <br>

        <div>
            <label for="programme">Programme:</label>
            <input
                type="text"
                id="programme"
                name="programme"
                required
            >
        </div>

        <br>

        <div>
            <label for="year_of_study">Year of Study:</label>
            <input
                type="number"
                id="year_of_study"
                name="year_of_study"
                min="1"
                max="8"
                required
            >
        </div>

        <br>

        <button type="submit">Add Student</button>

    </form>

</body>
</html>
